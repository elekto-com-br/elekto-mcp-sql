name: Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # Everything that runs third-party code (NuGet packages with build targets and analyzers, the
  # SQL Server container of the tests) runs here, with no secret and no OIDC token. All it hands on
  # is the package.
  build:
    name: Build, Test & Pack
    # Integration tests get a SQL Server from a Testcontainers container (Docker is preinstalled on Ubuntu runners)
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned by commit, with the release in a comment; Dependabot proposes new ones
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        shell: bash

      # The package takes its version from the csproj, while the GitHub Release and the MCP Registry
      # go by the tag. When the tag set the package version instead, the csproj sat at 1.0.3 while
      # v1.0.4, v1.0.5 and v1.0.6 shipped. Failing here, before anything is built, keeps them equal.
      - name: Verify the csproj version matches the tag
        shell: bash
        run: |
          CSPROJ=src/Elekto.Mcp.Sql.csproj
          CSPROJ_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$CSPROJ" | head -1)

          if [ -z "$CSPROJ_VERSION" ]; then
            echo "::error file=$CSPROJ::No <Version> element found."
            exit 1
          fi

          if [ "$CSPROJ_VERSION" != "$VERSION" ]; then
            echo "::error file=$CSPROJ::Tag ${GITHUB_REF_NAME} means version '${VERSION}', but the csproj declares '${CSPROJ_VERSION}'. Set them to the same value and re-tag."
            exit 1
          fi

          echo "Tag and csproj agree on ${VERSION}."

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      # From here on, the same steps as CI, so the package is built and checked as on every
      # pull request
      - name: Restore
        shell: bash
        run: dotnet restore --locked-mode

      - name: Build
        shell: bash
        run: dotnet build --no-restore -c Release

      - name: Test
        shell: bash
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

      - name: Pack
        shell: bash
        run: dotnet pack src/Elekto.Mcp.Sql.csproj --no-build -c Release -o ./dist

      - name: Verify the package
        shell: bash
        run: bash .github/scripts/verify-package.sh ./dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/*.nupkg
          if-no-files-found: error
          retention-days: 7

  # The only job that can publish to nuget.org. It checks out nothing and installs nothing: it takes
  # the package from the build job, attests where it came from, and pushes it with the dotnet
  # already on the runner.
  publish:
    name: Publish to NuGet.org
    needs: build
    runs-on: ubuntu-latest
    # Lets the Trusted Publishing policy on nuget.org name this environment, so that no other job
    # can trade its OIDC token for an API key
    environment: nuget
    permissions:
      contents: read
      id-token: write       # the nuget.org login, and the signing certificate of the attestation
      attestations: write   # stores the attestation with the repository

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist

      # SLSA build provenance for the package, which `gh attestation verify` checks. nuget.org adds
      # its own signature to the package it serves, so the copy to verify is the one the GitHub
      # Release carries.
      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.nupkg

      # Trusted Publishing: nuget.org trades this job's OIDC token for an API key that lasts an hour.
      # It runs once the repository variable NUGET_USER holds the nuget.org user who created the
      # policy. Until then, or if it fails, the push falls back to the stored NUGET_API_KEY.
      - name: Log in to nuget.org
        id: login
        if: vars.NUGET_USER != ''
        continue-on-error: true
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        shell: bash
        env:
          TRUSTED_PUBLISHING_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          STORED_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -n "$TRUSTED_PUBLISHING_KEY" ]; then
            echo "Pushing with a short-lived key from Trusted Publishing."
            NUGET_API_KEY=$TRUSTED_PUBLISHING_KEY
          elif [ -n "$STORED_KEY" ]; then
            echo "::warning::Pushing with the stored NUGET_API_KEY: Trusted Publishing is not set up, or it issued no key."
            NUGET_API_KEY=$STORED_KEY
          else
            echo "::error::No nuget.org credential: set up Trusted Publishing (variable NUGET_USER) or the secret NUGET_API_KEY."
            exit 1
          fi

          dotnet nuget push dist/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # Creates the GitHub Release for the tag, once the package is on NuGet, with the package attached.
  # Glama rebuilds the server on every GitHub release (its Auto-Release), so this keeps it in step
  # with nuget.org.
  github-release:
    name: Create the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist

      # The notes are the README's "What changed in <version>" section when there is one
      - name: Write release notes
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Drop a stray CR, so a heading saved with CRLF still matches
          awk -v h="## What changed in ${VERSION}" '
            { sub(/\r$/, "") }
            $0 == h { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' README.md > notes.md

          if ! grep -q '[^[:space:]]' notes.md; then
            : > notes.md
          fi
          {
            echo
            echo "Install or update: \`dotnet tool update -g Elekto.Mcp.Sql\`"
            echo
            echo "- NuGet: https://www.nuget.org/packages/Elekto.Mcp.Sql/${VERSION}"
            echo "- MCP Registry: io.github.elekto-com-br/elekto-mcp-sql"
            echo "- Provenance of the package attached here: \`gh attestation verify Elekto.Mcp.Sql.${VERSION}.nupkg --repo ${GITHUB_REPOSITORY}\`"
          } >> notes.md
          cat notes.md

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.nupkg --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

  # Lists the version just pushed to NuGet in the MCP Registry (registry.modelcontextprotocol.io).
  # A job of its own, so that it can be re-run alone, and so that its OIDC token never shares a
  # runner with the build.
  mcp-registry:
    name: Publish to the MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC login, which grants the io.github.elekto-com-br/* namespace
      contents: read

    steps:
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        shell: bash

      # nuget.org serves a new version only some minutes after the push, and not all at once: in the
      # 2.2.1 release the README answered while the package itself was still 404 (and missing from
      # the version list). So wait for the package, which is what users install, and only then check
      # the README, which the registry reads through the nuget.org API to prove the package is ours.
      - name: Wait for nuget.org to serve the package
        shell: bash
        run: |
          V=${VERSION,,}
          BASE="https://api.nuget.org/v3-flatcontainer/elekto.mcp.sql/${V}"
          MARKER="mcp-name: io.github.elekto-com-br/elekto-mcp-sql"

          for i in $(seq 1 60); do
            if curl -fsS "${BASE}/elekto.mcp.sql.${V}.nupkg" -o package.nupkg 2>/dev/null; then
              echo "nuget.org serves the package ${VERSION}."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::nuget.org did not serve the package ${VERSION} within 30 minutes. Re-run this job once the version shows on nuget.org."
              exit 1
            fi
            echo "Package not served yet (attempt ${i} of 60); waiting 30 s."
            sleep 30
          done

          curl -fsS "${BASE}/readme" -o readme.md \
            || { echo "::error::nuget.org serves the package ${VERSION} but not its README."; exit 1; }
          grep -qF "$MARKER" readme.md \
            || { echo "::error::The README of ${VERSION} on nuget.org lacks '${MARKER}'."; exit 1; }
          echo "Its README carries '${MARKER}'."

      # The manifest published is the one inside the package, with the version already written in
      - name: Take server.json from the package
        shell: bash
        run: |
          unzip -p package.nupkg .mcp/server.json > server.json
          cat server.json

      - name: Install mcp-publisher
        shell: bash
        env:
          MCP_PUBLISHER_VERSION: 1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish server.json
