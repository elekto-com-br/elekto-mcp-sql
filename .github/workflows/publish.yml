name: Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Pack & Publish
    # Integration tests get a SQL Server from a Testcontainers container (Docker is preinstalled on Ubuntu runners)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        shell: bash

      # The pack step below passes -p:Version=$VERSION, which overrides whatever the csproj
      # holds — so a tag that disagrees with the csproj publishes the tag's version in silence.
      # That is exactly how the csproj sat at 1.0.3 while v1.0.4, v1.0.5 and v1.0.6 shipped.
      # Failing here, before anything is built, makes the drift impossible instead of invisible.
      - name: Verify the csproj version matches the tag
        shell: bash
        run: |
          CSPROJ=src/Elekto.Mcp.Sql.csproj
          CSPROJ_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$CSPROJ" | head -1)

          if [ -z "$CSPROJ_VERSION" ]; then
            echo "::error file=$CSPROJ::No <Version> element found."
            exit 1
          fi

          if [ "$CSPROJ_VERSION" != "$VERSION" ]; then
            echo "::error file=$CSPROJ::Tag ${GITHUB_REF_NAME} means version '${VERSION}', but the csproj declares '${CSPROJ_VERSION}'. Set them to the same value and re-tag."
            exit 1
          fi

          echo "Tag and csproj agree on ${VERSION}."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        shell: bash
        run: dotnet restore

      - name: Build
        shell: bash
        run: dotnet build --no-restore -c Release

      - name: Test
        shell: bash
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

      - name: Pack
        shell: bash
        run: dotnet pack src/Elekto.Mcp.Sql.csproj -c Release -p:Version=${{ env.VERSION }} --output ./dist --verbosity normal

      - name: Locate package (diagnostic)
        shell: bash
        run: |
          echo "=== ./dist/ ===" && ls -la ./dist/ 2>&1 || echo "(empty or missing)"
          echo "=== all .nupkg files ==="
          find . -name "*.nupkg" 2>/dev/null || echo "(none found)"

      - name: Publish to NuGet.org
        shell: bash
        run: |
          NUPKG=$(find ./dist -name "*.nupkg" | head -1)
          if [ -z "$NUPKG" ]; then
            echo "ERROR: no .nupkg found in ./dist"
            exit 1
          fi
          echo "Pushing: $NUPKG"
          dotnet nuget push "$NUPKG" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # Creates the GitHub Release for the tag, once the package is on NuGet. Glama rebuilds the
  # server on every GitHub release (its Auto-Release), so this keeps it in step with nuget.org.
  github-release:
    name: Create the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The notes are the README's "What changed in <version>" section when there is one
      - name: Write release notes
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v h="## What changed in ${VERSION}" '
            $0 == h { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' README.md > notes.md

          if ! grep -q '[^[:space:]]' notes.md; then
            : > notes.md
          fi
          {
            echo
            echo "Install or update: \`dotnet tool update -g Elekto.Mcp.Sql\`"
            echo
            echo "- NuGet: https://www.nuget.org/packages/Elekto.Mcp.Sql/${VERSION}"
            echo "- MCP Registry: io.github.elekto-com-br/elekto-mcp-sql"
          } >> notes.md
          cat notes.md

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

  # Lists the version just pushed to NuGet in the MCP Registry (registry.modelcontextprotocol.io).
  # A job of its own, so that only it holds the OIDC token, and so that it can be re-run alone.
  mcp-registry:
    name: Publish to the MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC login, which grants the io.github.elekto-com-br/* namespace
      contents: read

    steps:
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        shell: bash

      # nuget.org serves a new version only some minutes after the push, and not all at once: in the
      # 2.2.1 release the README answered while the package itself was still 404 (and missing from
      # the version list). So wait for the package, which is what users install, and only then check
      # the README, which the registry reads through the nuget.org API to prove the package is ours.
      - name: Wait for nuget.org to serve the package
        shell: bash
        run: |
          V=${VERSION,,}
          BASE="https://api.nuget.org/v3-flatcontainer/elekto.mcp.sql/${V}"
          MARKER="mcp-name: io.github.elekto-com-br/elekto-mcp-sql"

          for i in $(seq 1 60); do
            if curl -fsS "${BASE}/elekto.mcp.sql.${V}.nupkg" -o package.nupkg 2>/dev/null; then
              echo "nuget.org serves the package ${VERSION}."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::nuget.org did not serve the package ${VERSION} within 30 minutes. Re-run this job once the version shows on nuget.org."
              exit 1
            fi
            echo "Package not served yet (attempt ${i} of 60); waiting 30 s."
            sleep 30
          done

          curl -fsS "${BASE}/readme" -o readme.md \
            || { echo "::error::nuget.org serves the package ${VERSION} but not its README."; exit 1; }
          grep -qF "$MARKER" readme.md \
            || { echo "::error::The README of ${VERSION} on nuget.org lacks '${MARKER}'."; exit 1; }
          echo "Its README carries '${MARKER}'."

      # The manifest published is the one inside the package, with the version already written in
      - name: Take server.json from the package
        shell: bash
        run: |
          unzip -p package.nupkg .mcp/server.json > server.json
          cat server.json

      - name: Install mcp-publisher
        shell: bash
        env:
          MCP_PUBLISHER_VERSION: 1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish server.json
