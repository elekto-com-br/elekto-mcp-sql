name: Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Pack & Publish
    # LocalDB (required by integration tests) is only available on Windows runners
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        shell: bash

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Start LocalDB
        run: sqllocaldb start MSSQLLocalDB

      - name: Restore
        shell: bash
        run: dotnet restore

      - name: Build
        shell: bash
        run: dotnet build --no-restore -c Release

      - name: Test
        shell: bash
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

      - name: Pack
        shell: bash
        run: dotnet pack src/Elekto.Mcp.Sql.csproj -c Release -p:Version=${{ env.VERSION }} --output ./dist --verbosity normal

      - name: Locate package (diagnostic)
        shell: bash
        run: |
          echo "=== ./dist/ ===" && ls -la ./dist/ 2>&1 || echo "(empty or missing)"
          echo "=== all .nupkg files ==="
          find . -name "*.nupkg" 2>/dev/null || echo "(none found)"

      - name: Publish to NuGet.org
        shell: bash
        run: |
          NUPKG=$(find ./dist -name "*.nupkg" | head -1)
          if [ -z "$NUPKG" ]; then
            echo "ERROR: no .nupkg found in ./dist"
            exit 1
          fi
          echo "Pushing: $NUPKG"
          dotnet nuget push "$NUPKG" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
