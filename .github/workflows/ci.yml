name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    # Integration tests get a SQL Server from a Testcontainers container (Docker is preinstalled on Ubuntu runners)
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned by commit, with the release in a comment; Dependabot proposes new ones
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      # Locked mode restores exactly the packages in the packages.lock.json files, or fails
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

      # The publish workflow packs and checks the package with these same two steps. Doing it here
      # as well finds a broken package, or a broken .mcp/server.json, on the pull request rather
      # than at release time.
      - name: Pack
        run: dotnet pack src/Elekto.Mcp.Sql.csproj --no-build -c Release -o ./dist

      - name: Verify the package
        run: bash .github/scripts/verify-package.sh ./dist
