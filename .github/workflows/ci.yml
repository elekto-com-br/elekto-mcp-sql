name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    # Integration tests get a SQL Server from a Testcontainers container (Docker is preinstalled on Ubuntu runners)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

      # Publishing packs only when a tag is pushed. Packing here as well finds a broken package,
      # or a broken .mcp/server.json, on the pull request rather than at release time.
      - name: Pack
        run: dotnet pack src/Elekto.Mcp.Sql.csproj --no-build -c Release -o ./dist

      - name: Verify the MCP server manifest in the package
        shell: bash
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Elekto.Mcp.Sql.csproj | head -1)
          NUPKG=$(find ./dist -name "*.nupkg" | head -1)

          unzip -p "$NUPKG" Elekto.Mcp.Sql.nuspec | grep -q '<packageType name="McpServer" />' \
            || { echo "::error::The package is not marked as an MCP server (PackageType McpServer)."; exit 1; }

          unzip -p "$NUPKG" .mcp/server.json > server.json \
            || { echo "::error::The package carries no .mcp/server.json."; exit 1; }

          jq -e --arg v "$VERSION" \
            '.version == $v and .packages[0].version == $v and .packages[0].identifier == "Elekto.Mcp.Sql"' \
            server.json > /dev/null \
            || { echo "::error::.mcp/server.json in the package does not declare Elekto.Mcp.Sql $VERSION."; cat server.json; exit 1; }

          # The MCP Registry accepts the package only if its README names the server
          NAME=$(jq -r .name server.json)
          unzip -p "$NUPKG" README.md | grep -qF "mcp-name: ${NAME}" \
            || { echo "::error::The packed README lacks 'mcp-name: ${NAME}', without which the MCP Registry refuses the package."; exit 1; }

          echo "Package ${VERSION} is an MCP server, its manifest agrees, and its README names ${NAME}."
